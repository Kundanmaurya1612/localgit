<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Kundan's Laptops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Using Inter font as a modern alternative to the system font stack */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="myweb.html" class="text-2xl font-bold text-gray-900 tracking-tight">Kundan's Laptops</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 sm:px-6 py-12">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-900">Your Shopping Cart</h1>
        
        <!-- Main grid for cart items and summary -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- Left Side: Cart Items Container -->
            <div id="cart-items-container" class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <!-- Cart items will be dynamically rendered here by JavaScript -->
            </div>

            <!-- Right Side: Order Summary Container -->
            <div id="cart-summary-container" class="lg:col-span-1">
                 <!-- Order summary will be dynamically rendered here by JavaScript -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-16">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm text-gray-400">&copy; 2025 Kundan's Laptops. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        /**
         * Renders the entire cart, including items and the summary.
         * It handles both the populated and empty states of the cart.
         */
        function renderCart() {
            // Attempt to get cart from localStorage, default to an empty array if not found.
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const itemsContainer = document.getElementById('cart-items-container');
            const summaryContainer = document.getElementById('cart-summary-container');

            // --- EMPTY CART STATE ---
            if (cart.length === 0) {
                // Display a user-friendly message when the cart is empty.
                itemsContainer.innerHTML = `
                    <div class="text-center py-16">
                        <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <h3 class="mt-4 text-xl font-semibold text-gray-900">Your cart is empty</h3>
                        <p class="mt-2 text-base text-gray-500">Looks like you haven't added any items yet.</p>
                        <div class="mt-6">
                            <a href="myweb.html" class="inline-flex items-center px-5 py-2.5 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                `;
                summaryContainer.innerHTML = ''; // Clear summary section if cart is empty
                return;
            }

            // --- POPULATED CART STATE ---
            
            // --- 1. Render Cart Items Table ---
            let itemTotal = 0;
            let itemsHtml = `
                <h2 class="text-xl font-semibold mb-4 text-gray-900">Cart Items (${cart.length})</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="text-left font-semibold text-gray-600 p-3">Product</th>
                                <th class="text-right font-semibold text-gray-600 p-3">Price</th>
                                <th class="text-center font-semibold text-gray-600 p-3">Quantity</th>
                                <th class="text-center font-semibold text-gray-600 p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            cart.forEach((item, idx) => {
                const price = parseInt(item.price) || 0;
                const qty = parseInt(item.qty) || 0;
                itemTotal += price * qty;
                itemsHtml += `
                    <tr class="border-b border-gray-200">
                        <td class="p-4">
                            <div class="flex items-center">
                                <!-- Image Placeholder -->
                                <img src="https://placehold.co/64x64/e2e8f0/adb5bd?text=Image" alt="${item.name}" class="w-16 h-16 object-cover rounded-md mr-4 flex-shrink-0">
                                <span class="font-medium text-gray-800">${item.name}</span>
                            </div>
                        </td>
                        <td class="text-right font-medium p-4">₹${price.toLocaleString()}</td>
                        <td class="text-center p-4">${qty}</td>
                        <td class="text-center p-4">
                            <button class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors" onclick="removeItem(${idx})">
                                Remove
                            </button>
                        </td>
                    </tr>
                `;
            });

            itemsHtml += `
                        </tbody>
                    </table>
                </div>
            `;
            itemsContainer.innerHTML = itemsHtml;

            // --- 2. Render Order Summary ---
            const gst = Math.round(itemTotal * 0.18);
            const delivery = 100;
            const platform = 100;
            const packing = 100;
            const grandTotal = itemTotal + gst + delivery + platform + packing;
            
            const summaryHtml = `
                <div class="bg-white p-6 rounded-lg shadow-md sticky top-28">
                    <h2 class="text-xl font-semibold mb-4 border-b border-gray-200 pb-4">Order Summary</h2>
                    <div class="space-y-3 text-gray-600">
                        <div class="flex justify-between">
                            <span>Item Total</span>
                            <span class="font-medium text-gray-900">₹${itemTotal.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>GST (18%)</span>
                            <span class="font-medium text-gray-900">₹${gst.toLocaleString()}</span>
                        </div>
                         <div class="flex justify-between">
                            <span>Delivery Fee</span>
                            <span class="font-medium text-gray-900">₹${delivery.toLocaleString()}</span>
                        </div>
                         <div class="flex justify-between">
                            <span>Platform Fee</span>
                            <span class="font-medium text-gray-900">₹${platform.toLocaleString()}</span>
                        </div>
                         <div class="flex justify-between">
                            <span>Packing Fee</span>
                            <span class="font-medium text-gray-900">₹${packing.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="flex justify-between font-bold text-lg text-gray-900 mt-4 pt-4 border-t border-gray-200">
                        <span>Grand Total</span>
                        <span>₹${grandTotal.toLocaleString()}</span>
                    </div>
                    <div class="mt-6">
                        <button onclick="checkout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 shadow-sm hover:shadow-md">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            `;
            summaryContainer.innerHTML = summaryHtml;
        }

        /**
         * Removes an item from the cart based on its index.
         * @param {number} idx - The index of the item to remove.
         */
        function removeItem(idx) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(idx, 1); // Remove the item at the specified index
            localStorage.setItem('cart', JSON.stringify(cart)); // Update localStorage
            renderCart(); // Re-render the cart to reflect the change
        }

        /**
         * Simulates a checkout process.
         */
        function checkout() {
            // In a real app, this would redirect to a payment page.
            // Here, we just show an alert and clear the cart.
            alert('Thank you for your purchase!');
            localStorage.removeItem('cart');
            renderCart(); // Re-render to show the empty cart state
        }

        // Initial render of the cart when the page loads.
        window.onload = renderCart;
    </script>

</body>
</html>
